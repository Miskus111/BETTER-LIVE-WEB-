name: Weekly checks

# Shop pages, source URLs and known vulnerabilities change without any commit here: check weekly.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shop links (affiliate)
        run: npm run check:links
      - name: PubMed citations match their studies
        run: npm run check:sources
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
